<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeju Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #F4F7F9;
            --header-bg: #5D737E;
            --text-main: #455A64;
            --text-sub: #90A4AE;
            --accent-blue: #B0C4DE;
            --card-white: #FFFFFF;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 100px; }

        header { background: var(--header-bg); padding: 20px 20px 15px; position: relative; color: #fff; }

        /* 1. 左上角年份修正 */
        .year-label {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: 'Montserrat';
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .app-title { text-align: center; font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; margin: 30px 0 20px; }

        /* 2. 濟州島封面圖片預覽 */
        .cover-photo {
            width: 100%;
            height: 220px;
            background-image: url('https://images.unsplash.com/photo-1542359649-31e03ad4d92c?auto=format&fit=crop&w=1000&q=80'); 
            background-size: cover;
            background-position: center;
        }

        .date-scroller { display: flex; overflow-x: auto; gap: 15px; padding: 10px 20px; background: var(--header-bg); }
        .date-item { min-width: 60px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: none; background: transparent; color: rgba(255,255,255,0.6); transition: 0.3s; }
        .date-item.active { background: rgba(255,255,255,0.2); color: #fff; border-radius: 12px; font-weight: 700; }
        .date-item .d-day { font-size: 0.7rem; font-weight: 600; }
        .date-item .d-num { font-size: 1.1rem; font-family: 'Montserrat'; }

        .main { padding: 20px; max-width: 500px; margin: 0 auto; }
        .itinerary-container { position: relative; padding-left: 20px; }
        .itinerary-container::before { content: ''; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: var(--accent-blue); opacity: 0.5; }

        .event-card { background: var(--card-white); border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        /* 3. 拖拽手柄 (前面的圓點) */
        .drag-handle {
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--header-bg);
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: grab; /* 提示可以抓取 */
            z-index: 10;
        }
        .drag-handle:active { cursor: grabbing; }

        .time-label { font-family: 'Montserrat'; font-size: 0.9rem; font-weight: 700; min-width: 50px; color: var(--header-bg); }
        .info-box { flex: 1; padding-left: 10px; }
        .event-title { font-size: 1.1rem; font-weight: 700; }

        /* 詳情與彈窗部分省略以節省篇幅，內容邏輯與之前一致 */
        .detail-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 2000; padding: 50px 25px; }
        .back-btn { font-size: 1.1rem; font-weight: 700; color: var(--header-bg); cursor: pointer; margin-bottom: 30px; display: block; }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--header-bg); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header>
    <div class="year-label">2026 MAY</div>
    <div class="app-title">JEJU PLANNER</div>
    <div class="date-scroller" id="day-tabs"></div>
</header>

<div class="cover-photo"></div>

<div class="main">
    <div class="itinerary-container" id="itinerary-list"></div>
</div>

<div id="detailView" class="detail-view"><div class="back-btn" onclick="closeDetail()">✕ CLOSE</div><div id="detailContent"></div></div>
<div class="fab" onclick="openModal()">＋</div>

<script>
    let currentDay = 1;
    let tripData = JSON.parse(localStorage.getItem('jejuFinal')) || {
        1: [
            {time:'10:00', cat:'Sightseeing', title:'龍頭岩 Yongduam', desc:'濟州市地標景點。'},
            {time:'13:00', cat:'Food', title:'黑豬肉料理', desc:'濟州島代表美食。'}
        ],
        2: [], 3: [], 4: [], 5: []
    };

    const tabs = document.getElementById('day-tabs');
    for(let i=1; i<=5; i++){
        tabs.innerHTML += `<div class="date-item ${i==1?'active':''}" onclick="setDay(${i}, this)"><span class="d-day">DAY</span><span class="d-num">${i}</span></div>`;
    }

    const listEl = document.getElementById('itinerary-list');
    
    // 限制只能透過 .drag-handle 拖拽
    Sortable.create(listEl, {
        animation: 200,
        handle: '.drag-handle', // 關鍵設定：只有點擊圓點才能拖動
        onEnd: function() {
            let newData = [];
            listEl.querySelectorAll('.event-card').forEach(card => newData.push(JSON.parse(card.dataset.info)));
            tripData[currentDay] = newData;
            localStorage.setItem('jejuFinal', JSON.stringify(tripData));
        }
    });

    function setDay(day, el) {
        currentDay = day;
        document.querySelectorAll('.date-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function render() {
        listEl.innerHTML = tripData[currentDay].map((item, index) => `
            <div class="event-card" data-info='${JSON.stringify(item)}'>
                <div class="drag-handle"></div> <div class="time-label" onclick="openDetail(${index})">${item.time}</div>
                <div class="info-box" onclick="openDetail(${index})">
                    <div class="event-title">${item.title}</div>
                </div>
            </div>
        `).join('');
    }

    function openDetail(index) {
        const item = tripData[currentDay][index];
        document.getElementById('detailContent').innerHTML = `<h1 style="font-size:2rem">${item.title}</h1><p style="font-size:1.1rem; line-height:1.8">${item.desc}</p>`;
        document.getElementById('detailView').style.display = 'block';
    }

    function closeDetail() { document.getElementById('detailView').style.display = 'none'; }
    function openModal() { alert('此處可加入原本的新增視窗邏輯'); } // 簡化處理以專注於你的需求
    
    render();
</script>

</body>
</html>
