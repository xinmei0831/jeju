<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seoul Trip Planner</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css" />

    <style>
        :root {
            --main-color: #4A3E3E;
            --accent-green: #03C75A;
            --bg-gray: #F8F9FA;
        }

        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-gray); margin: 0; padding-bottom: 100px; color: #333; }
        
        header { background: var(--main-color); color: #fff; padding: 25px 20px; text-align: center; }
        header h1 { font-family: 'Montserrat'; font-size: 1.2rem; letter-spacing: 3px; margin: 0; }

        /* 行程卡片清單 */
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .event-card { 
            background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px;
            cursor: pointer;
        }
        .time-badge { font-family: 'Montserrat'; font-weight: 700; color: var(--main-color); min-width: 60px; }
        .title-text { font-weight: 700; font-size: 1.1rem; }

        /* 詳情頁面 */
        .overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #fff; z-index: 2000; overflow-y: auto; 
        }
        .detail-hero { width: 100%; height: 280px; background-size: cover; background-position: center; background-color: #eee; position: relative; }
        .close-btn { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .content-body { padding: 25px; }
        .naver-btn { 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--accent-green); color: #fff; padding: 12px; border-radius: 12px;
            text-decoration: none; font-weight: 700; margin: 20px 0;
        }

        /* 裁減視窗 */
        .crop-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 3000; 
        }
        .crop-box { background: #fff; width: 90%; max-width: 400px; margin: 50px auto; border-radius: 20px; padding: 20px; text-align: center; }
        #cropper-target { width: 100%; height: 300px; margin-bottom: 20px; }

        /* 編輯欄位 */
        .edit-field { margin-bottom: 15px; }
        .edit-field label { font-size: 0.8rem; color: #888; display: block; margin-bottom: 5px; }
        .edit-field input, .edit-field textarea { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--main-color); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<header><h1>SEOUL TRIP PLANNER</h1></header>

<div class="container" id="list"></div>

<div id="detailOverlay" class="overlay">
    <div class="detail-hero" id="viewImg">
        <div class="close-btn" onclick="closeOverlay()">✕</div>
    </div>
    <div class="content-body">
        <div id="readMode">
            <h2 id="vTitle" style="margin:0 0 5px 0;"></h2>
            <div id="vTime" style="color:#888; font-weight:bold; margin-bottom:20px;"></div>
            <a id="vMap" href="#" class="naver-btn" target="_blank">📍 開啟 Naver Map</a>
            <div style="white-space: pre-wrap; line-height: 1.6;" id="vDesc"></div>
            <button onclick="enterEdit()" style="margin-top:30px; width:100%; padding:15px; border:1px solid #ddd; border-radius:10px; background:none;">✎ 編輯此行程</button>
        </div>

        <div id="editMode" style="display:none;">
            <div class="edit-field">
                <label>更換景點照片</label>
                <input type="file" accept="image/*" onchange="startCrop(this)">
            </div>
            <div class="edit-field"><label>景點名稱</label><input type="text" id="iTitle"></div>
            <div class="edit-field"><label>時間 (如 14:00)</label><input type="text" id="iTime"></div>
            <div class="edit-field"><label>Naver Map 網址</label><input type="text" id="iMap"></div>
            <div class="edit-field"><label>筆記/介紹</label><textarea id="iDesc" rows="4"></textarea></div>
            <button onclick="saveData()" style="width:100%; padding:15px; background:var(--main-color); color:#fff; border:none; border-radius:10px; font-weight:bold;">儲存並更新</button>
        </div>
    </div>
</div>

<div id="cropModal" class="crop-modal">
    <div class="crop-box">
        <h3>調整照片範圍</h3>
        <div id="cropper-target"></div>
        <button onclick="cancelCrop()" style="padding:10px 20px;">取消</button>
        <button onclick="finishCrop()" style="padding:10px 20px; background:var(--main-color); color:#fff; border-radius:8px;">確認裁減</button>
    </div>
</div>

<div class="fab" onclick="addNew()">＋</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>
<script>
    let tripData = JSON.parse(localStorage.getItem('TripV2')) || [{title:'LowKey Seongsu', time:'14:00', img:'', map:'', desc:''}];
    let activeIdx = 0;
    let cropper = null;
    let tempImgBase64 = "";

    function render() {
        document.getElementById('list').innerHTML = tripData.map((d, i) => `
            <div class="event-card" onclick="openDetail(${i})">
                <div class="time-badge">${d.time}</div>
                <div class="title-text">${d.title}</div>
            </div>
        `).join('');
    }

    function openDetail(i) {
        activeIdx = i;
        const d = tripData[i];
        document.getElementById('vTitle').innerText = d.title;
        document.getElementById('vTime').innerText = d.time;
        document.getElementById('vDesc').innerText = d.desc || '尚無筆記';
        document.getElementById('vMap').href = d.map || '#';
        document.getElementById('viewImg').style.backgroundImage = d.img ? `url(${d.img})` : 'none';
        
        document.getElementById('iTitle').value = d.title;
        document.getElementById('iTime').value = d.time;
        document.getElementById('iMap').value = d.map;
        document.getElementById('iDesc').value = d.desc;
        tempImgBase64 = d.img;

        document.getElementById('readMode').style.display = 'block';
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('detailOverlay').style.display = 'block';
    }

    function startCrop(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('cropModal').style.display = 'block';
                setTimeout(() => {
                    const el = document.getElementById('cropper-target');
                    if (cropper) cropper.destroy();
                    cropper = new Croppie(el, {
                        viewport: { width: 300, height: 200, type: 'square' },
                        boundary: { width: '100%', height: 280 },
                        showZoomer: true
                    });
                    cropper.bind({ url: e.target.result });
                }, 200);
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function finishCrop() {
        cropper.result('base64').then(base64 => {
            tempImgBase64 = base64;
            document.getElementById('viewImg').style.backgroundImage = `url(${base64})`;
            cancelCrop();
        });
    }

    function saveData() {
        tripData[activeIdx] = {
            title: document.getElementById('iTitle').value,
            time: document.getElementById('iTime').value,
            map: document.getElementById('iMap').value,
            desc: document.getElementById('iDesc').value,
            img: tempImgBase64
        };
        localStorage.setItem('TripV2', JSON.stringify(tripData));
        render();
        openDetail(activeIdx);
    }

    function addNew() {
        tripData.push({title:'新行程', time:'00:00', img:'', map:'', desc:''});
        render();
        openDetail(tripData.length - 1);
        enterEdit();
    }

    function enterEdit() {
        document.getElementById('readMode').style.display = 'none';
        document.getElementById('editMode').style.display = 'block';
    }
    function closeOverlay() { document.getElementById('detailOverlay').style.display = 'none'; }
    function cancelCrop() { document.getElementById('cropModal').style.display = 'none'; }

    render();
</script>
</body>
</html>
