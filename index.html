<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeju Planner - Image Editable</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #F4F7F9;
            --header-bg: #5D737E;
            --text-main: #2D3436;
            --text-sub: #636E72;
            --accent-blue: #B0C4DE;
            --card-white: #FFFFFF;
            --naver-green: #03C75A;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 100px; }

        header { background: var(--header-bg); padding: 20px 0 15px; position: relative; color: #fff; }
        .year-label { position: absolute; top: 20px; left: 20px; font-family: 'Montserrat'; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px; }
        .app-title { text-align: center; font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; margin: 30px 0 20px; }
        
        .date-scroller { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-item { width: 80px; height: 80px; min-width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: none; background: transparent; color: rgba(255,255,255,0.5); transition: 0.3s; }
        .date-item.active { background: rgba(255,255,255,0.2); color: #fff; border-radius: 16px; }
        .date-item .d-num { font-size: 1.2rem; font-weight: 700; font-family: 'Montserrat'; }

        /* 行程卡片樣式 */
        .main { padding: 20px; max-width: 500px; margin: 0 auto; }
        .event-card { background: var(--card-white); border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; }
        .time-label { font-family: 'Montserrat'; font-size: 0.9rem; font-weight: 700; color: var(--header-bg); }
        .event-title { font-size: 1.05rem; font-weight: 700; }

        /* --- 詳情頁面新樣式：增加頂部照片區域 --- */
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; overflow-y: auto; }
        
        /* 這裡是照片放置區 */
        .detail-header-img { 
            width: 100%; height: 280px; 
            background-size: cover; background-position: center; 
            position: relative; background-color: #eee;
        }
        
        .nav-btn { position: absolute; top: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(5px); z-index: 10; }
        .back-btn { left: 20px; }
        .edit-toggle-btn { right: 20px; width: auto; padding: 0 15px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }

        .detail-body { padding: 30px 25px; }
        .read-mode h1 { font-size: 1.8rem; font-weight: 800; margin: 0 0 10px 0; }
        .view-time { font-family: 'Montserrat'; color: var(--header-bg); font-weight: 600; margin-bottom: 25px; display: block; }
        
        .info-list { border-top: 1px solid #EEE; padding-top: 20px; }
        .info-item { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; color: #636E72; font-size: 0.95rem; }
        .naver-link-btn { background: var(--naver-green); color: #fff; padding: 4px 10px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; font-weight: 700; margin-left: auto; }

        /* 編輯模式樣式 */
        .edit-mode { display: none; }
        .edit-group { margin-bottom: 15px; }
        .edit-label { display: block; font-size: 0.75rem; color: #95a5a6; margin-bottom: 5px; font-weight: 700; }
        .edit-input { width: 100%; border: 1px solid #eee; padding: 12px; border-radius: 12px; font-size: 1rem; background: #f9f9f9; font-family: inherit; }
        .save-btn { width: 100%; background: var(--header-bg); color: #fff; border: none; padding: 16px; border-radius: 15px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 20px; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--header-bg); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="year-label">2026 MAY</div>
    <div class="app-title">JEJU PLANNER</div>
    <div id="day-tabs" class="date-scroller"></div>
</header>

<div class="main">
    <div id="itinerary-list"></div>
</div>

<div id="detailOverlay" class="detail-overlay">
    <div class="detail-header-img" id="viewImg">
        <div class="nav-btn back-btn" onclick="closeDetail()">✕</div>
        <div class="nav-btn edit-toggle-btn" id="toggleBtn" onclick="toggleEditMode()">✎ 編輯行程</div>
    </div>

    <div class="detail-body">
        <div id="readMode" class="read-mode">
            <h1 id="viewTitle">景點名稱</h1>
            <span class="view-time" id="viewTime">10:00 AM</span>
            <div class="info-list">
                <div class="info-item">📍 <span id="viewAddr">地址資訊</span> <a href="#" id="viewMapLink" class="naver-link-btn" target="_blank">NAVER Maps</a></div>
                <div class="info-item">⏰ <span id="viewOpen">營業時間</span></div>
                <div class="info-item">📞 <span id="viewPhone">聯絡電話</span></div>
            </div>
            <div style="margin-top:25px; border-top:1px solid #eee; padding-top:20px;">
                <b style="display:block; margin-bottom:10px;">景點介紹</b>
                <p id="viewDesc" style="line-height:1.6; color:#455A64;">描述內容...</p>
            </div>
        </div>
        
        <div id="editMode" class="edit-mode">
            <div class="edit-group">
                <span class="edit-label">圖片網址 (請貼上圖片連結)</span>
                <input type="text" id="inImg" class="edit-input" placeholder="https://example.com/image.jpg">
            </div>
            <div class="edit-group">
                <span class="edit-label">景點名稱</span>
                <input type="text" id="inTitle" class="edit-input">
            </div>
            <div class="edit-group">
                <span class="edit-label">時間</span>
                <input type="text" id="inTime" class="edit-input">
            </div>
            <div class="edit-group">
                <span class="edit-label">Naver Map 連結</span>
                <input type="text" id="inMapUrl" class="edit-input">
            </div>
            <div class="edit-group">
                <span class="edit-label">地址 / 營業時間 / 電話</span>
                <input type="text" id="inAddr" class="edit-input" placeholder="地址" style="margin-bottom:8px">
                <input type="text" id="inOpen" class="edit-input" placeholder="營業時間" style="margin-bottom:8px">
                <input type="text" id="inPhone" class="edit-input" placeholder="電話">
            </div>
            <div class="edit-group">
                <span class="edit-label">景點介紹</span>
                <textarea id="inDesc" class="edit-input" rows="4"></textarea>
            </div>
            <button class="save-btn" onclick="saveData()">儲存更新</button>
        </div>
    </div>
</div>

<div class="fab" onclick="addNewItem()">＋</div>

<script>
    let currentDay = 1;
    let editingIndex = null;
    let isEditMode = false;

    // 初始資料增加 img 欄位
    let tripData = JSON.parse(localStorage.getItem('jejuDataV2')) || {
        1: [{time:'10:00', title:'龍頭岩 Yongduam', addr:'濟州市龍頭岩路', open:'24小時', phone:'無', img:'https://images.unsplash.com/photo-1542359649-31e03ad4d92c', mapUrl:'https://naver.me/5vI6v6kG', desc:'龍頭岩是濟州著名的地標。'}],
        2: [], 3: [], 4: [], 5: []
    };

    function render() {
        const listEl = document.getElementById('itinerary-list');
        const items = tripData[currentDay] || [];
        listEl.innerHTML = items.map((item, index) => `
            <div class="event-card" onclick="openDetail(${index})">
                <div class="time-label">${item.time}</div>
                <div class="event-title">${item.title}</div>
            </div>`).join('');
    }

    function openDetail(index) {
        editingIndex = index;
        isEditMode = false;
        const item = tripData[currentDay][index];
        
        // 閱讀模式填值
        document.getElementById('viewImg').style.backgroundImage = `url('${item.img || ''}')`;
        document.getElementById('viewTitle').innerText = item.title;
        document.getElementById('viewTime').innerText = item.time + ' AM';
        document.getElementById('viewAddr').innerText = item.addr;
        document.getElementById('viewOpen').innerText = item.open;
        document.getElementById('viewPhone').innerText = item.phone;
        document.getElementById('viewDesc').innerText = item.desc;
        document.getElementById('viewMapLink').href = item.mapUrl || '#';

        // 編輯模式填值
        document.getElementById('inImg').value = item.img || '';
        document.getElementById('inTitle').value = item.title;
        document.getElementById('inTime').value = item.time;
        document.getElementById('inAddr').value = item.addr;
        document.getElementById('inOpen').value = item.open;
        document.getElementById('inPhone').value = item.phone;
        document.getElementById('inDesc').value = item.desc;
        document.getElementById('inMapUrl').value = item.mapUrl || '';

        document.getElementById('readMode').style.display = 'block';
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('toggleBtn').innerText = '✎ 編輯行程';
        document.getElementById('detailOverlay').style.display = 'block';
    }

    function toggleEditMode() {
        isEditMode = !isEditMode;
        document.getElementById('readMode').style.display = isEditMode ? 'none' : 'block';
        document.getElementById('editMode').style.display = isEditMode ? 'block' : 'none';
        document.getElementById('toggleBtn').innerText = isEditMode ? '✕ 取消編輯' : '✎ 編輯行程';
    }

    function saveData() {
        tripData[currentDay][editingIndex] = {
            time: document.getElementById('inTime').value,
            title: document.getElementById('inTitle').value,
            addr: document.getElementById('inAddr').value,
            open: document.getElementById('inOpen').value,
            phone: document.getElementById('inPhone').value,
            desc: document.getElementById('inDesc').value,
            img: document.getElementById('inImg').value,
            mapUrl: document.getElementById('inMapUrl').value
        };
        localStorage.setItem('jejuDataV2', JSON.stringify(tripData));
        render();
        openDetail(editingIndex); // 重新整理閱讀視窗
    }

    function addNewItem() {
        if(!tripData[currentDay]) tripData[currentDay] = [];
        tripData[currentDay].push({time:'09:00', title:'新景點', addr:'', open:'', phone:'', desc:'', img:'', mapUrl:''});
        render();
        openDetail(tripData[currentDay].length - 1);
        toggleEditMode(); // 直接進入編輯
    }

    function closeDetail() { document.getElementById('detailOverlay').style.display = 'none'; }

    // 初始化日期列 (簡化版)
    const tabs = document.getElementById('day-tabs');
    [1,2,3,4,5].forEach(d => {
        tabs.innerHTML += `<div class="date-item ${d==1?'active':''}" onclick="currentDay=${d}; render(); document.querySelectorAll('.date-item').forEach(i=>i.classList.remove('active')); this.classList.add('active');"><span class="d-num">${d+12}</span></div>`;
    });

    render();
</script>
</body>
</html>
