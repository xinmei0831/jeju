<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeju Travel Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #F4F7F9;
            --header-bg: #5D737E;
            --card-bg: #FFFFFF;
            --text-main: #455A64;
            --text-sub: #90A4AE;
            --accent: #B0C4DE;
            --naver-green: #03C75A;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 100px; overflow-x: hidden; }

        /* 頂部導航 */
        header { background: var(--header-bg); padding: 45px 20px 15px; position: sticky; top: 0; z-index: 100; color: #fff; text-align: center; }
        .app-title { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; margin-bottom: 15px; }

        .date-scroller { display: flex; overflow-x: auto; gap: 10px; padding: 5px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-item {
            min-width: 70px; height: 85px; background: rgba(255,255,255,0.2); border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border: none; color: #fff; transition: 0.3s;
        }
        .date-item.active { background: #fff; color: var(--header-bg); transform: scale(1.05); }

        .main { padding: 20px; max-width: 500px; margin: 0 auto; }

        /* 行程卡片 - 列表樣式 (圖一/三) */
        .event-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 15px; position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: grab;
            transition: transform 0.2s;
        }
        .event-card:active { cursor: grabbing; transform: scale(0.98); }
        .sortable-ghost { opacity: 0.4; background: var(--accent); }

        .time-label { font-family: 'Montserrat'; font-size: 0.9rem; font-weight: 700; min-width: 55px; color: var(--header-bg); }
        .content-box { flex: 1; border-left: 2px solid var(--accent); padding-left: 15px; }
        .event-title { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
        .event-tag { font-size: 0.65rem; color: var(--text-sub); font-weight: 700; text-transform: uppercase; }

        /* 詳情頁面 (圖二) */
        .detail-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 2000; overflow-y: auto; padding: 40px 25px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .back-btn { font-size: 1.5rem; cursor: pointer; margin-bottom: 20px; display: inline-block; color: var(--header-bg); }
        .detail-header-tag { color: var(--text-sub); font-weight: 700; font-size: 0.8rem; letter-spacing: 2px; }
        .detail-title { font-size: 1.8rem; font-weight: 700; margin: 10px 0 20px; color: var(--text-main); }
        .detail-desc { line-height: 1.8; color: #555; font-size: 1rem; margin-bottom: 30px; }
        
        .map-full-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--naver-green); color: #fff; text-decoration: none;
            padding: 15px; border-radius: 15px; font-weight: 700; width: 100%;
        }

        /* 懸浮按鈕 */
        .fab {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--header-bg); color: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); cursor: pointer; z-index: 500;
        }

        /* 新增行程彈窗 (Modal) */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 3000; align-items: flex-end; }
        .modal-content { background:#fff; width:100%; border-radius:30px 30px 0 0; padding:30px 25px; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        input, textarea, select { width: 100%; background: #F0F4F7; border: none; padding: 15px; border-radius: 12px; margin-bottom: 12px; font-family: inherit; }
        .save-btn { background: var(--header-bg); color: #fff; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: 700; }
    </style>
</head>
<body>

<header>
    <div class="app-title">JEJU PLANNER</div>
    <div class="date-scroller" id="date-scroller"></div>
</header>

<div class="main">
    <div id="itinerary-list"></div>
</div>

<div id="detailView" class="detail-view">
    <span class="back-btn" onclick="closeDetail()">← BACK</span>
    <div id="detailContent"></div>
</div>

<div class="fab" onclick="openModal()">＋</div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0">New Itinerary</h3>
        <input type="text" id="in-time" placeholder="Time (e.g. 10:30)">
        <input type="text" id="in-title" placeholder="Location Name">
        <select id="in-cat">
            <option value="Sightseeing">Sightseeing</option>
            <option value="Food">Food</option>
            <option value="Activity">Activity</option>
        </select>
        <textarea id="in-desc" rows="4" placeholder="Description..."></textarea>
        <button class="save-btn" onclick="saveItem()">Add to Schedule</button>
        <button onclick="closeModal()" style="background:none; border:none; width:100%; margin-top:10px; color:var(--text-sub)">Cancel</button>
    </div>
</div>

<script>
    let currentDay = 1;
    let tripData = JSON.parse(localStorage.getItem('jejuPro')) || {
        1: [
            {time:'14:00', cat:'Sightseeing', title:'龍頭岩 Yongduam', desc:'濟州市地標，海邊奇石觀賞區。'},
            {time:'18:00', cat:'Food', title:'黑豬肉一條街', desc:'體驗濟州島最道地的烤肉文化。'}
        ],
        2: [], 3: [], 4: [], 5: []
    };

    // 初始化日期列
    const scroller = document.getElementById('date-scroller');
    for(let i=1; i<=5; i++) {
        scroller.innerHTML += `<div class="date-item ${i==1?'active':''}" onclick="setDay(${i}, this)"><span class="d-day">DAY</span><span style="font-size:1.1rem; font-weight:700">${i}</span></div>`;
    }

    function setDay(day, el) {
        currentDay = day;
        document.querySelectorAll('.date-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    // 初始化拖拽功能 (SortableJS)
    const listEl = document.getElementById('itinerary-list');
    Sortable.create(listEl, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: function() {
            // 當拖拽結束，更新數據順序
            const cards = listEl.querySelectorAll('.event-card');
            let newData = [];
            cards.forEach(card => newData.push(JSON.parse(card.dataset.info)));
            tripData[currentDay] = newData;
            localStorage.setItem('jejuPro', JSON.stringify(tripData));
        }
    });

    function render() {
        listEl.innerHTML = tripData[currentDay].map((item, index) => `
            <div class="event-card" data-info='${JSON.stringify(item)}' onclick="openDetail(${index})">
                <div class="time-label">${item.time}</div>
                <div class="content-box">
                    <span class="event-tag">${item.cat}</span>
                    <div class="event-title">${item.title}</div>
                </div>
            </div>
        `).join('');
    }

    function openDetail(index) {
        const item = tripData[currentDay][index];
        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <span class="detail-header-tag">${item.cat}</span>
            <h1 class="detail-title">${item.title}</h1>
            <p class="detail-desc">${item.desc || '暫無詳細描述。'}</p>
            <a href="https://map.naver.com/v5/search/${encodeURIComponent(item.title)}" target="_blank" class="map-full-btn">📍 Open in Naver Map</a>
        `;
        document.getElementById('detailView').style.display = 'block';
    }

    function closeDetail() { document.getElementById('detailView').style.display = 'none'; }
    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveItem() {
        const newItem = {
            time: document.getElementById('in-time').value,
            title: document.getElementById('in-title').value,
            cat: document.getElementById('in-cat').value,
            desc: document.getElementById('in-desc').value
        };
        if(!newItem.title) return;
        tripData[currentDay].push(newItem);
        localStorage.setItem('jejuPro', JSON.stringify(tripData));
        closeModal();
        render();
    }

    render();
</script>

</body>
</html>
