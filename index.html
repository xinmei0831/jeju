<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeju Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>

    <style>
        :root {
            --bg-color: #F4F7F9;
            --header-bg: #5D737E;
            --text-main: #2D3436;
            --text-sub: #636E72;
            --accent-blue: #B0C4DE;
            --card-white: #FFFFFF;
            --naver-green: #03C75A;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 100px; }

        header { background: var(--header-bg); padding: 20px 0 15px; position: relative; color: #fff; }
        .year-label { 
            position: absolute; top: 20px; left: 20px; font-family: 'Montserrat'; font-size: 0.8rem; font-weight: 700;
            padding: 4px 12px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px;
        }
        .app-title { text-align: center; font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; margin: 30px 0 20px; }
        
        /* 保持您原本的日期捲軸樣式 */
        .date-scroller { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-item {
            width: 80px; height: 80px; min-width: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; border: none; background: transparent; color: rgba(255,255,255,0.5); transition: 0.3s;
        }
        .date-item.active { background: rgba(255,255,255,0.2); color: #fff; border-radius: 16px; }
        .date-item .d-day { font-size: 0.6rem; font-weight: 700; margin-bottom: 2px; opacity: 0.8; }
        .date-item .d-num { font-size: 1.2rem; font-weight: 700; font-family: 'Montserrat'; line-height: 1; }
        .date-item .d-week { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-top: 2px; opacity: 0.8; }

        .day-info-row { display: flex; justify-content: space-between; align-items: center; padding: 25px 20px 15px; }
        .day-title-group { display: flex; align-items: baseline; gap: 10px; }
        .day-title-group h2 { margin: 0; font-family: 'Montserrat'; font-size: 1.8rem; font-weight: 800; color: #2D3436; }
        .day-title-group .sub-date { font-size: 0.95rem; color: var(--text-sub); font-weight: 500; }

        .hero-container { padding: 0 20px; margin-bottom: 25px; cursor: pointer; position: relative; }
        .hero-image { width: 100%; height: 220px; background-size: cover; background-position: center; border-radius: 28px; position: relative; box-shadow: 0 10px 20px rgba(0,0,0,0.1); background-color: #e0e0e0; }
        .location-badge { position: absolute; bottom: 18px; left: 18px; background: rgba(0, 0, 0, 0.4); color: #fff; padding: 5px 14px; border-radius: 50px; font-size: 0.75rem; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 4px; z-index: 2; }

        .main { padding: 0 20px; max-width: 500px; margin: 0 auto; }
        .itinerary-container { position: relative; padding-left: 20px; }
        .itinerary-container::before { content: ''; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: var(--accent-blue); opacity: 0.5; }
        
        /* 彈出層樣式修正 */
        .full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
        .overlay-header-img { width: 100%; height: 280px; background-size: cover; background-position: center; position: relative; background-color: #eee; }
        .nav-btn { position: absolute; top: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(5px); z-index: 3010; }
        .back-btn { left: 20px; }
        .edit-toggle-btn { right: 20px; width: auto; padding: 0 15px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }

        /* 修正重點：加大底部 padding 避免按鈕被手機工具列擋住 */
        .overlay-body { padding: 30px 25px 150px; position: relative; }
        
        .edit-group { margin-bottom: 15px; }
        .edit-label { display: block; font-size: 0.75rem; color: #95a5a6; margin-bottom: 5px; font-weight: 700; }
        .edit-input { width: 100%; border: 1px solid #eee; padding: 12px; border-radius: 12px; font-size: 1rem; background: #f9f9f9; -webkit-appearance: none; }
        
        /* 修正儲存按鈕樣式 */
        .save-btn { 
            display: block; width: 100%; background: var(--header-bg); color: #fff; 
            border: none; padding: 18px; border-radius: 15px; font-size: 1.1rem; 
            font-weight: 800; cursor: pointer; margin-top: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative; z-index: 3100;
        }

        .upload-trigger { width: 100%; background: #fff; border: 2px dashed var(--accent-blue); padding: 15px; border-radius: 12px; color: var(--header-bg); font-weight: 700; cursor: pointer; text-align: center; }

        #cropModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; padding: 20px; }
        .crop-container { background: #fff; border-radius: 24px; padding: 20px; width: 100%; max-width: 400px; margin: 20px auto; }
        
        .event-card { background: var(--card-white); border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.03); cursor: pointer; }
        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--header-bg); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; z-index: 2000; }
    </style>
</head>
<body>

<header>
    <div class="year-label">2026 MAY</div>
    <div class="app-title">JEJU PLANNER</div>
    <div id="day-tabs" class="date-scroller"></div> </header>

<div class="day-info-row">
    <div class="day-title-group">
        <h2 id="display-day">DAY 1</h2>
        <span class="sub-date" id="display-full-date">05-13(週一)</span>
    </div>
</div>

<div class="hero-container" onclick="openCoverEditor()">
    <div class="hero-image" id="top-hero-img">
        <div class="location-badge">📍 <span id="top-loc-name">龍頭岩</span></div>
    </div>
</div>

<div class="main">
    <div id="itinerary-list" class="itinerary-container"></div>
</div>

<div id="coverOverlay" class="full-overlay">
    <div class="overlay-header-img" id="coverEditImg">
        <div class="nav-btn back-btn" onclick="closeCoverEditor()">✕</div>
    </div>
    <div class="overlay-body">
        <h2 style="margin: 0 0 25px 0; font-weight: 800;">編輯主視覺</h2>
        <div class="edit-group">
            <span class="edit-label">封面照片</span>
            <div class="upload-trigger" onclick="triggerFileUpload('cover')">📷 選取照片並裁切</div>
        </div>
        <div class="edit-group">
            <span class="edit-label">地點名稱</span>
            <input type="text" id="inCoverTitle" class="edit-input">
        </div>
        <button id="coverSaveBtn" class="save-btn">儲存封面</button>
    </div>
</div>

<div id="detailOverlay" class="full-overlay">
    <div class="overlay-header-img" id="viewImg">
        <div class="nav-btn back-btn" onclick="closeDetail()">✕</div>
        <div class="nav-btn edit-toggle-btn" id="toggleBtn" onclick="toggleItemEditMode()">✎ 編輯行程</div>
    </div>
    <div class="overlay-body">
        <div id="itemReadMode">
            <h1 id="viewTitle">景點名稱</h1>
            <p id="viewTime" style="font-weight:bold; color:var(--header-bg);">10:00</p>
            <p id="viewDesc"></p>
        </div>
        
        <div id="itemEditMode" style="display:none;">
            <div class="edit-group">
                <span class="edit-label">景點照片</span>
                <div class="upload-trigger" onclick="triggerFileUpload('item')">📷 選取照片</div>
            </div>
            <div class="edit-group"><span class="edit-label">景點名稱</span><input type="text" id="inTitle" class="edit-input"></div>
            <div class="edit-group"><span class="edit-label">時間</span><input type="text" id="inTime" class="edit-input"></div>
            <div class="edit-group"><span class="edit-label">描述</span><textarea id="inDesc" class="edit-input" rows="4"></textarea></div>
            <button id="itemSaveBtn" class="save-btn">儲存更新</button>
        </div>
    </div>
</div>

<input type="file" id="fileInput" hidden accept="image/*">

<div id="cropModal">
    <div class="crop-container">
        <h3 style="margin-top:0">裁剪照片</h3>
        <div id="cropTarget"></div>
        <div class="crop-btns" style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="closeCrop()" style="flex:1; padding:12px; border-radius:10px; border:none;">取消</button>
            <button onclick="finishCrop()" style="flex:1; padding:12px; border-radius:10px; border:none; background:var(--header-bg); color:#fff;">確認</button>
        </div>
    </div>
</div>

<div class="fab" onclick="addNewItem()">＋</div>

<script>
    let currentDay = 1;
    let editingIndex = null;
    let isItemEditMode = false;
    let croppieInst = null;
    let tempImgBase64 = '';
    let currentCropTarget = ''; 

    // 初始化資料（包含獨立封面結構）
    const defaultData = {
        cover: { title: '龍頭岩之旅', img: 'https://images.unsplash.com/photo-1542359649-31e03ad4d92c' },
        days: { 1: [], 2: [], 3: [], 4: [], 5: [] }
    };

    let tripData = JSON.parse(localStorage.getItem('jejuProV4')) || defaultData;

    // 您原本的日期資料
    const dates = [
        {day:1,num:13,wk:'Mon',f:'05-13(週一)'},
        {day:2,num:14,wk:'Tue',f:'05-14(週二)'},
        {day:3,num:15,wk:'Wed',f:'05-15(週三)'},
        {day:4,num:16,wk:'Thu',f:'05-16(週四)'},
        {day:5,num:17,wk:'Fri',f:'05-17(週五)'}
    ];

    function initTabs() {
        const tabs = document.getElementById('day-tabs');
        tabs.innerHTML = dates.map(d => `
            <div class="date-item ${d.day==currentDay?'active':''}" onclick="setDay(${d.day}, this)">
                <span class="d-day">DAY ${d.day}</span>
                <span class="d-num">${d.num}</span>
                <span class="d-week">${d.wk}</span>
            </div>`).join('');
    }

    function setDay(day, el) {
        currentDay = day;
        document.querySelectorAll('.date-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('display-day').innerText = `DAY ${day}`;
        document.getElementById('display-full-date').innerText = dates.find(d => d.day === day).f;
        render();
    }

    function renderCover() {
        document.getElementById('top-hero-img').style.backgroundImage = `url('${tripData.cover.img}')`;
        document.getElementById('top-loc-name').innerText = tripData.cover.title;
    }

    function render() {
        const items = tripData.days[currentDay] || [];
        document.getElementById('itinerary-list').innerHTML = items.map((item, index) => `
            <div class="event-card" onclick="openDetail(${index})">
                <div style="font-weight:bold; min-width:50px;">${item.time}</div>
                <div>${item.title}</div>
            </div>`).join('');
    }

    // 核心修正：改用 JS 監聽器，確保點擊反應更快、更準
    document.getElementById('coverSaveBtn').addEventListener('click', function(e) {
        e.preventDefault();
        tripData.cover = {
            title: document.getElementById('inCoverTitle').value,
            img: tempImgBase64
        };
        localStorage.setItem('jejuProV4', JSON.stringify(tripData));
        renderCover();
        closeCoverEditor();
    });

    document.getElementById('itemSaveBtn').addEventListener('click', function(e) {
        e.preventDefault();
        tripData.days[currentDay][editingIndex] = {
            title: document.getElementById('inTitle').value,
            time: document.getElementById('inTime').value,
            desc: document.getElementById('inDesc').value,
            img: tempImgBase64
        };
        localStorage.setItem('jejuProV4', JSON.stringify(tripData));
        render();
        openDetail(editingIndex);
    });

    // 其他原本的功能保持不變
    function openCoverEditor() {
        tempImgBase64 = tripData.cover.img;
        document.getElementById('inCoverTitle').value = tripData.cover.title;
        document.getElementById('coverEditImg').style.backgroundImage = `url('${tempImgBase64}')`;
        document.getElementById('coverOverlay').style.display = 'block';
    }

    function openDetail(index) {
        editingIndex = index;
        const item = tripData.days[currentDay][index];
        tempImgBase64 = item.img;
        document.getElementById('viewImg').style.backgroundImage = `url('${item.img}')`;
        document.getElementById('viewTitle').innerText = item.title;
        document.getElementById('viewTime').innerText = item.time;
        document.getElementById('viewDesc').innerText = item.desc;
        
        document.getElementById('inTitle').value = item.title;
        document.getElementById('inTime').value = item.time;
        document.getElementById('inDesc').value = item.desc;

        document.getElementById('itemReadMode').style.display = 'block';
        document.getElementById('itemEditMode').style.display = 'none';
        document.getElementById('toggleBtn').innerText = '✎ 編輯行程';
        document.getElementById('detailOverlay').style.display = 'block';
    }

    function toggleItemEditMode() {
        isItemEditMode = !isItemEditMode;
        document.getElementById('itemReadMode').style.display = isItemEditMode ? 'none' : 'block';
        document.getElementById('itemEditMode').style.display = isItemEditMode ? 'block' : 'none';
        document.getElementById('toggleBtn').innerText = isItemEditMode ? '✕ 取消' : '✎ 編輯行程';
    }

    function triggerFileUpload(target) {
        currentCropTarget = target;
        document.getElementById('fileInput').click();
    }

    document.getElementById('fileInput').onchange = function() {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('cropModal').style.display = 'block';
                if(croppieInst) croppieInst.destroy();
                croppieInst = new Croppie(document.getElementById('cropTarget'), {
                    viewport: { width: 300, height: 200 },
                    boundary: { width: 320, height: 280 },
                    showZoomer: true
                });
                croppieInst.bind({ url: e.target.result });
            }
            reader.readAsDataURL(this.files[0]);
        }
    };

    function finishCrop() {
        croppieInst.result({type:'base64', size:'viewport'}).then(base64 => {
            tempImgBase64 = base64;
            if (currentCropTarget === 'cover') document.getElementById('coverEditImg').style.backgroundImage = `url('${base64}')`;
            else document.getElementById('viewImg').style.backgroundImage = `url('${base64}')`;
            closeCrop();
        });
    }

    function addNewItem() {
        tripData.days[currentDay].push({time:'09:00', title:'新景點', desc:'', img:''});
        render();
        openDetail(tripData.days[currentDay].length - 1);
        toggleItemEditMode();
    }

    function closeCoverEditor() { document.getElementById('coverOverlay').style.display = 'none'; }
    function closeDetail() { document.getElementById('detailOverlay').style.display = 'none'; }
    function closeCrop() { document.getElementById('cropModal').style.display = 'none'; }

    // 初始化頁面
    initTabs();
    renderCover();
    render();
</script>
</body>
</html>
