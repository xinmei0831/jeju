<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jeju Planner - Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #F4F7F9;
            --header-bg: #5D737E;
            --text-main: #2D3436;
            --accent-blue: #B0C4DE;
            --card-white: #FFFFFF;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Noto Sans TC', sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding-bottom: 100px; }

        /* Header & Date Tabs (跟之前一樣) */
        header { background: var(--header-bg); padding: 20px 0 15px; position: relative; color: #fff; }
        .year-label { position: absolute; top: 20px; left: 20px; font-family: 'Montserrat'; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 50px; }
        .app-title { text-align: center; font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; margin: 30px 0 20px; }
        .date-scroller { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-item { width: 80px; height: 80px; min-width: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: none; background: transparent; color: rgba(255,255,255,0.5); transition: 0.3s; }
        .date-item.active { background: rgba(255,255,255,0.2); color: #fff; border-radius: 16px; }
        .date-item .d-day { font-size: 0.6rem; font-weight: 700; margin-bottom: 2px; }
        .date-item .d-num { font-size: 1.2rem; font-weight: 700; font-family: 'Montserrat'; line-height: 1; }
        .date-item .d-week { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        /* 行程卡片 */
        .main { padding: 0 20px; max-width: 500px; margin: 0 auto; margin-top: 20px; }
        .itinerary-container { position: relative; padding-left: 20px; }
        .itinerary-container::before { content: ''; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 2px; background: var(--accent-blue); opacity: 0.5; }
        .event-card { background: var(--card-white); border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .drag-handle { position: absolute; left: -20px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; background: var(--header-bg); border-radius: 50%; border: 2px solid #fff; cursor: grab; z-index: 10; }
        .time-label { font-family: 'Montserrat'; font-size: 0.9rem; font-weight: 700; min-width: 55px; color: var(--header-bg); }
        .event-title { font-size: 1.05rem; font-weight: 700; flex: 1; }

        /* --- 編輯詳情頁樣式 --- */
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 3000; overflow-y: auto; }
        .detail-header-img { width: 100%; height: 250px; background-size: cover; background-position: center; position: relative; background-color: #eee; }
        .close-detail { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; backdrop-filter: blur(5px); z-index: 10; }
        
        .detail-body { padding: 20px; }
        .edit-group { margin-bottom: 20px; }
        .edit-label { display: block; font-size: 0.75rem; color: #95a5a6; margin-bottom: 5px; font-weight: 700; text-transform: uppercase; }
        .edit-input { width: 100%; border: 1px solid #eee; padding: 12px; border-radius: 10px; font-size: 1rem; font-family: inherit; background: #f9f9f9; }
        .edit-input:focus { outline: none; border-color: var(--header-bg); background: #fff; }
        
        .save-btn { width: 100%; background: var(--header-bg); color: #fff; border: none; padding: 15px; border-radius: 15px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }

        .fab { position: fixed; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--header-bg); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="year-label">2026 MAY</div>
    <div class="app-title">JEJU PLANNER</div>
    <div id="day-tabs" class="date-scroller"></div>
</header>

<div class="main">
    <div id="itinerary-list" class="itinerary-container"></div>
</div>

<div id="detailOverlay" class="detail-overlay">
    <div id="editHeaderImg" class="detail-header-img">
        <div class="close-detail" onclick="closeDetail()">✕</div>
    </div>
    <div class="detail-body">
        <div class="edit-group">
            <span class="edit-label">圖片網址 (Image URL)</span>
            <input type="text" id="editImgUrl" class="edit-input" placeholder="貼上圖片連結..." oninput="updatePreviewImg(this.value)">
        </div>
        <div class="edit-group">
            <span class="edit-label">景點名稱</span>
            <input type="text" id="editTitle" class="edit-input">
        </div>
        <div class="edit-group">
            <span class="edit-label">時間 (例如 10:00)</span>
            <input type="text" id="editTime" class="edit-input">
        </div>
        <div class="edit-group">
            <span class="edit-label">地址</span>
            <input type="text" id="editAddr" class="edit-input">
        </div>
        <div class="edit-group">
            <span class="edit-label">詳細介紹</span>
            <textarea id="editDesc" class="edit-input" rows="4"></textarea>
        </div>
        <button class="save-btn" onclick="saveDetails()">儲存修改內容</button>
    </div>
</div>

<div class="fab" onclick="addNewEvent()">＋</div>

<script>
    let currentDay = 1;
    let editingIndex = null;
    const dates = [
        {day:1, num:13, week:'Mon'}, {day:2, num:14, week:'Tue'},
        {day:3, num:15, week:'Wed'}, {day:4, num:16, week:'Thu'}, {day:5, num:17, week:'Fri'}
    ];

    // 初始化資料
    let tripData = JSON.parse(localStorage.getItem('jejuFinalData')) || {
        1: [{time:'10:00', title:'點擊我進行編輯', addr:'濟州市', desc:'這裡可以寫介紹...', img:'https://images.unsplash.com/photo-1542359649-31e03ad4d92c'}],
        2: [], 3: [], 4: [], 5: []
    };

    const tabs = document.getElementById('day-tabs');
    dates.forEach(d => {
        tabs.innerHTML += `<div class="date-item ${d.day==1?'active':''}" onclick="setDay(${d.day}, this)"><span class="d-day">DAY ${d.day}</span><span class="d-num">${d.num}</span><span class="d-week">${d.week}</span></div>`;
    });

    const listEl = document.getElementById('itinerary-list');
    Sortable.create(listEl, { animation: 200, handle: '.drag-handle' });

    function setDay(day, el) {
        currentDay = day;
        document.querySelectorAll('.date-item').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function render() {
        listEl.innerHTML = (tripData[currentDay] || []).map((item, index) => `
            <div class="event-card" onclick="openEdit(${index})">
                <div class="drag-handle" onclick="event.stopPropagation()"></div>
                <div class="time-label">${item.time}</div>
                <div class="event-title">${item.title}</div>
            </div>`).join('');
    }

    // 開啟編輯窗
    function openEdit(index) {
        editingIndex = index;
        const item = tripData[currentDay][index];
        
        document.getElementById('editTitle').value = item.title || '';
        document.getElementById('editTime').value = item.time || '';
        document.getElementById('editAddr').value = item.addr || '';
        document.getElementById('editDesc').value = item.desc || '';
        document.getElementById('editImgUrl').value = item.img || '';
        
        updatePreviewImg(item.img);
        
        document.getElementById('detailOverlay').style.display = 'block';
    }

    function updatePreviewImg(url) {
        document.getElementById('editHeaderImg').style.backgroundImage = url ? `url('${url}')` : 'none';
    }

    function saveDetails() {
        if(editingIndex === null) return;
        
        tripData[currentDay][editingIndex] = {
            title: document.getElementById('editTitle').value,
            time: document.getElementById('editTime').value,
            addr: document.getElementById('editAddr').value,
            desc: document.getElementById('editDesc').value,
            img: document.getElementById('editImgUrl').value
        };
        
        localStorage.setItem('jejuFinalData', JSON.stringify(tripData));
        closeDetail();
        render();
    }

    function addNewEvent() {
        const newItem = { time: '12:00', title: '新行程', addr: '', desc: '', img: '' };
        if(!tripData[currentDay]) tripData[currentDay] = [];
        tripData[currentDay].push(newItem);
        render();
        openEdit(tripData[currentDay].length - 1);
    }

    function closeDetail() {
        document.getElementById('detailOverlay').style.display = 'none';
    }

    render();
</script>
</body>
</html>
